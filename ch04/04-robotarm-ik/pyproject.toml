[project]
name = "ch04-04-robotarm-ik"
version = "0.1.0"
description = "2축 로봇 역운동학(IK) 좌표 기반 이동 (ch04)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "mujoco: requires MuJoCo runtime (EGL or OS default)",
    "slow: episode-length integration",
    "network: requires HF Hub access",
]
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
